# ==========================================
# 1. CONFIGURAÇÕES DO SERVIDOR
# ==========================================

server.port=8080
spring.application.name=rest-skeleton-java

# ==========================================
# 2. CONFIGURAÇÕES DO BANCO DE DADOS (POSTGRESQL)
# ==========================================

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rest_skeleton_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:user}

# ==========================================
# 3. CONFIGURAÇÕES DO HIBERNATE / JPA
# ==========================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# 4. CONFIGURAÇÕES DO FLYWAY (MIGRATIONS)
# ==========================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ==========================================
# 5. CONFIGURAÇÕES DE SEGURANÇA (JWT)
# ==========================================

api.security.token.secret=${JWT_SECRET:chave_secreta_super_segura_padrao_para_ambiente_local}
api.security.token.expiration=2